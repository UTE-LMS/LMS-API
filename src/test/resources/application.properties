# ==============================================================================
# TEST ENVIRONMENT CONFIGURATION
# Cổng mặc định 27018 cho container Docker rs0 cục bộ, cho phép ghi đè qua MONGODB_URI
# ==============================================================================
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27018/learning_outcomes?replicaSet=rs0}
management.endpoints.web.exposure.include=health,info

# ==============================================================================
# CÁCH LY INITIAL_ADMIN_* TRONG TEST
# Luôn đặt rỗng để ngăn chặn việc biến môi trường OS vô tình kích hoạt seeder tạo admin vào DB thật
# ==============================================================================
INITIAL_ADMIN_USERNAME=
INITIAL_ADMIN_EMAIL=
INITIAL_ADMIN_PASSWORD=

# ==============================================================================
# CẤU HÌNH JWT BẢO MẬT DÙNG TRONG TEST
# Khóa thử nghiệm cố định đủ 64 ký tự (>= 32 bytes)
# ==============================================================================
app.security.jwt.secret=0123456789012345678901234567890123456789012345678901234567890123
app.security.jwt.ttl=60m
app.security.jwt.issuer=lms-api
