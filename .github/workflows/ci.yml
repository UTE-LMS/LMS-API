name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

# Commit mới lên cùng nhánh/PR thì hủy lần chạy CI cũ chưa xong. Tách theo event để run `push` không hủy
# nhầm run `pull_request` (check bắt buộc của PR). Riêng `main` không hủy để mỗi lần merge đều có kết quả.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # mvnw được lưu với mode 100644 trong git nên cần quyền thực thi trên runner Linux
      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # Khởi chạy MongoDB 8.0 replica set rs0 phục vụ kiểm thử tích hợp giao dịch (@Transactional)
      - name: Start MongoDB 8.0 Replica Set (rs0)
        run: |
          echo ">>> 1. Starting MongoDB 8.0 container with replSet rs0..."
          docker run -d \
            --name mongodb \
            -p 27017:27017 \
            mongo:8.0 \
            mongod --replSet rs0 --bind_ip_all

          # Chờ có giới hạn: container chết hoặc quá hạn thì in log mongod và fail, không lặp vô hạn
          wait_for() {
            local description="$1"; shift
            local attempt
            for attempt in $(seq 1 60); do
              if [ "$(docker inspect -f '{{.State.Running}}' mongodb)" != "true" ]; then
                echo "::error::MongoDB container stopped while waiting for: $description"
                docker logs mongodb
                exit 1
              fi
              if "$@"; then return 0; fi
              echo "Waiting for $description ($attempt/60)..."
              sleep 1
            done
            echo "::error::Timed out waiting for: $description"
            docker logs mongodb
            exit 1
          }
          mongo_ping() { docker exec mongodb mongosh --quiet --eval "db.adminCommand('ping').ok" | grep -q 1; }
          mongo_primary() { docker exec mongodb mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -q true; }

          echo ">>> 2. Waiting for MongoDB server to accept ping..."
          wait_for "mongod to accept ping" mongo_ping

          echo ">>> 3. Initiating replica set rs0..."
          docker exec mongodb mongosh --quiet --eval "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] })"

          echo ">>> 4. Waiting for replica set primary to become writable..."
          wait_for "replica set primary election" mongo_primary

          echo ">>> 5. Importing schema validators and initial data into learning_outcomes..."
          docker cp doc/database_import.js mongodb:/tmp/database_import.js
          docker exec mongodb mongosh --quiet learning_outcomes /tmp/database_import.js

          echo ">>> MongoDB 8.0 replica set rs0 is ready and initialized."

      - name: Prepare application configuration
        run: cp src/main/resources/application.properties.example src/main/resources/application.properties

      - name: Build and test with Maven verify
        env:
          SPRING_MONGODB_URI: mongodb://localhost:27017/learning_outcomes?replicaSet=rs0
          MONGODB_URI: mongodb://localhost:27017/learning_outcomes?replicaSet=rs0
          JWT_SECRET: "c2VjcmV0LWtleS1mb3ItdGVzdGluZy1wdXJwb3Nlcy1vbmx5LTMyYnl0ZXM="
          INITIAL_ADMIN_USERNAME: ""
          INITIAL_ADMIN_EMAIL: ""
          INITIAL_ADMIN_PASSWORD: ""
        run: ./mvnw -B verify
